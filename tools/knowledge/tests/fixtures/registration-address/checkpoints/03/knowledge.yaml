      "id": "snapshot:address:test",
      "adapter": "repository",
      "locator": "sources/App/src/Modules/iRIS.EOsago.Tests/Code/EOsago/ExternalFunctions/QuestionnaireExternalFunctionsInvokerTests.cs:251-329",
