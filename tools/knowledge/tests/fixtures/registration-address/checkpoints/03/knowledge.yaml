      "availability": "available",
      "excerpt": "        public bool ValidateRegistrationAddress(BaseViewModel viewModel, string propertyName, string personType)\n        {\n            const int city = 4;\n            const int street = 7;\n            int addressLevel = street;\n\n            var property = viewModel.GetProperty<ViewModelProperty<string>>(propertyName);\n            if (ShouldSkipRegistrationAddressValidationForImportProlongation(propertyName, property?.Value, city, out addressLevel))\n            {\n                return true;\n            }\n\n            bool valid = string.IsNullOrEmpty(property.Value) ||\n                         (int.TryParse(property.Value, out addressLevel) &&\n                          addressLevel >= street);\n\n            if (valid == false)\n            {\n                property.Errors.Add(addressLevel switch\n                {\n                    int _ when addressLevel < city => $\"Проверьте корректность указанного адреса регистрации {personType}.\",\n                    int _ when addressLevel < street => $\"Проверьте корректность указания улицы и номера дома в адресе регистрации {personType}.\",\n                    _ => string.Empty\n                });\n            }\n\n            return valid;\n        }\n\n        private bool ShouldSkipRegistrationAddressValidationForImportProlongation(\n            string propertyName,\n            string accuracyValue,\n            int minCityAccuracyLevel,\n            out int parsedAccuracy)\n        {\n            parsedAccuracy = 0;\n            var processApiContext = _context?.ServiceProvider?.GetService(typeof(ProcessApiContext)) as ProcessApiContext;\n            if (propertyName != nameof(AutoQuestionnaireStepViewModel.InsurantRegistrationAddressRecognitionAccuracy)\n                && propertyName != nameof(AutoQuestionnaireStepOwnerViewModel.OwnerRegistrationAddressRecognitionAccuracy))\n            {\n                return false;\n            }\n\n            if (processApiContext?.Command is not EOsagoImportLink2Command\n                || processApiContext.ViewModel is not EOsagoImportViewModel importViewModel)\n            {\n                return false;\n            }\n\n            var prolongationId = importViewModel[ProlongationIdPropertyName]?.ToString()?.Trim();\n            if (string.IsNullOrEmpty(prolongationId)\n                || !int.TryParse(accuracyValue, out parsedAccuracy))\n            {\n                return false;\n            }\n\n            return parsedAccuracy >= minCityAccuracyLevel;\n        }\n\n        /// <summary>\n        /// Валидирует дату истечения паспорта.\n        /// </summary>\n"
    },
