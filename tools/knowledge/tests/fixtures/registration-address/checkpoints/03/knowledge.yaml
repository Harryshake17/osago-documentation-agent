      "content_hash": "ee99e8752593433cfff57258e754d3397d3a425094e05a862063b94cd3e7d6b3",
      "hash_scope": "excerpt",
      "working_tree_state": "dirty",
      "availability": "available",
      "excerpt": "\n        [Test(Description = \"Проверяет валидацию введенного адреса и сообщение, в зависимости от уровня\")]\n        [TestCase(\"1\", \"Проверьте корректность указанного адреса регистрации страхователя.\", ExpectedResult = false)]\n        [TestCase(\"2\", \"Проверьте корректность указанного адреса регистрации страхователя.\", ExpectedResult = false)]\n        [TestCase(\"3\", \"Проверьте корректность указанного адреса регистрации страхователя.\", ExpectedResult = false)]\n        [TestCase(\"4\", \"Проверьте корректность указания улицы и номера дома в адресе регистрации страхователя.\", ExpectedResult = false)]\n        [TestCase(\"5\", \"Проверьте корректность указания улицы и номера дома в адресе регистрации страхователя.\", ExpectedResult = false)]\n        [TestCase(\"6\", \"Проверьте корректность указания улицы и номера дома в адресе регистрации страхователя.\", ExpectedResult = false)]\n        [TestCase(\"7\", null, ExpectedResult = true)]\n        public bool ValidateRegistrationAddress_AddressLevel_ShouldReturnCorrectMessage(string addressLevel, string errorMessage)\n        {\n            // Arrange\n            var invoker = new QuestionnaireExternalFunctionsInvoker(null, null, null, null, null, null, null, null, null);\n            var viewModel = new AutoQuestionnaireStepViewModel();\n            var property = new ViewModelProperty<string>\n            {\n                Value = addressLevel\n            };\n            viewModel[Names.InsurantRegistrationAddressRecognitionAccuracy] = property;\n\n            // Act\n            var result = invoker.ValidateRegistrationAddress(viewModel, Names.InsurantRegistrationAddressRecognitionAccuracy, \"страхователя\");\n            var error = property.Errors.FirstOrDefault();\n\n            // Assert\n            Assert.AreEqual(errorMessage, error);\n            return result;\n        }\n\n        [Test(Description = \"При импорте пролонгации и уровне адреса >= 4 валидация AddressRecognitionAccuracy пропускается\")]\n        [TestCase(\"4\")]\n        [TestCase(\"5\")]\n        [TestCase(\"6\")]\n        public void ValidateRegistrationAddress_ImportProlongationAndAccuracyAtLeastFour_ShouldSkipValidation(string addressLevel)\n        {\n            // Arrange\n            var processApiContext = new ProcessApiContext\n            {\n                Command = new EOsagoImportLink2Command(),\n                ViewModel = new EOsagoImportViewModel()\n            };\n            processApiContext.ViewModel.GetDictionary().Add(\"prolongationId\", \"prolongation-id\");\n            var context = BuildPipelineExecutionContext(processApiContext);\n\n            var invoker = new QuestionnaireExternalFunctionsInvoker(null, context, null, null, null, null, null, null, null);\n            var viewModel = new AutoQuestionnaireStepViewModel();\n            var property = new ViewModelProperty<string> { Value = addressLevel };\n            viewModel[Names.InsurantRegistrationAddressRecognitionAccuracy] = property;\n\n            // Act\n            var result = invoker.ValidateRegistrationAddress(viewModel, Names.InsurantRegistrationAddressRecognitionAccuracy, \"страхователя\");\n\n            // Assert\n            Assert.IsTrue(result);\n            Assert.IsEmpty(property.Errors);\n        }\n\n        [Test(Description = \"Без prolongationId поведение остается прежним: уровень 4 не проходит\")]\n        public void ValidateRegistrationAddress_ImportWithoutProlongationId_ShouldKeepOriginalValidation()\n        {\n            // Arrange\n            var processApiContext = new ProcessApiContext\n            {\n                Command = new EOsagoImportLink2Command(),\n                ViewModel = new EOsagoImportViewModel()\n            };\n            var context = BuildPipelineExecutionContext(processApiContext);\n\n            var invoker = new QuestionnaireExternalFunctionsInvoker(null, context, null, null, null, null, null, null, null);\n            var viewModel = new AutoQuestionnaireStepViewModel();\n            var property = new ViewModelProperty<string> { Value = \"4\" };\n            viewModel[Names.InsurantRegistrationAddressRecognitionAccuracy] = property;\n\n            // Act\n            var result = invoker.ValidateRegistrationAddress(viewModel, Names.InsurantRegistrationAddressRecognitionAccuracy, \"страхователя\");\n\n            // Assert\n            Assert.IsFalse(result);\n            Assert.AreEqual(\"Проверьте корректность указания улицы и номера дома в адресе регистрации страхователя.\", property.Errors.FirstOrDefault());\n"
    }
  ],
